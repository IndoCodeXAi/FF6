name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unduh core mGBA
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a core_tmp
          curl --fail --location --retry 3 \
            -o core.zip \
            https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mgba_libretro_android.so.zip
          unzip -o core.zip -d core_tmp
          test -s core_tmp/mgba_libretro_android.so
          cp core_tmp/mgba_libretro_android.so app/src/main/jniLibs/arm64-v8a/libmgba_core.so
          file app/src/main/jniLibs/arm64-v8a/libmgba_core.so

      - name: Build APK debug (untuk pengujian)
        run: gradle assembleDebug --no-daemon

      - name: Siapkan kunci release
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$RELEASE_STORE_PASSWORD" ] && \
             [ -n "$RELEASE_KEY_ALIAS" ] && \
             [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
            test -s "$RELEASE_STORE_FILE"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets belum lengkap; APK release tidak dibuat."
          fi

      - name: Build APK release (ditandatangani)
        if: steps.signing.outputs.ready == 'true'
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FF6Advance-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: FF6Advance-release-APK
          path: app/build/outputs/apk/release/app-release.apk
