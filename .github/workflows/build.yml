name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unduh core mGBA
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a core_tmp
          curl -fL -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mgba_libretro_android.so.zip
          unzip -o core.zip -d core_tmp
          mv core_tmp/mgba_libretro_android.so app/src/main/jniLibs/arm64-v8a/libmgba_core.so
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FF6Advance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
